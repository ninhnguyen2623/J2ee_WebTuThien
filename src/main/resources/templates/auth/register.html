<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Đăng ký</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Register Form Template" name="keywords">
    <meta content="Register Form Template" name="description">

    <!-- Favicon -->
    <link th:href="@{img/favicon.ico}" rel="icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .register-container {
            display: flex;
            width: 900px;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .side-panel {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            width: 40%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .side-panel img {
            max-width: 120px;
            margin-bottom: 30px;
        }
        
        .welcome-text {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .welcome-description {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .register-card {
            background-color: #fff;
            width: 60%;
            padding: 50px 40px;
            overflow-y: auto;
            max-height: 600px;
        }
        
        .register-title {
            color: #223354;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E0E3E7;
            border-radius: 8px;
            font-size: 16px;
            color: #223354;
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        .form-control:focus {
            border-color: #4F46E5;
        }
        
        .text-danger {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
        
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-bottom: 15px;
        }
        
        .btn-primary {
            background-color: #4F46E5;
            color: #fff;
        }
        
        .btn-primary:hover {
            background-color: #4338CA;
        }
        
        .login-link {
            text-align: center;
            margin-top: 10px;
        }
        
        .login-link a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .register-container {
                flex-direction: column;
                max-width: 90%;
            }
            
            .side-panel, .register-card {
                width: 100%;
            }
            
            .side-panel {
                padding: 40px 30px;
            }
            
            .register-card {
                padding: 40px 30px;
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="side-panel">
            <img th:src="@{img/logo.png}" alt="Logo">
            <h2 class="welcome-text">Đăng ký</h2>
            <p class="welcome-description">Đăng ký tài khoản để tham gia cùng chúng tôi bạn nhé!</p>
        </div>
        
        <style>
          .side-panel img {
              max-width: 200px; 
              max-height: 200px; 
              margin-bottom: 30px;
              object-fit: contain; 
          }
      </style>

        <div class="register-card">
            <h1 class="register-title">Đăng ký</h1>
            
            <form th:action="@{/register}" th:object="${register}" method="post">
                <div class="form-group">
                    <input type="text" placeholder="Tên đầy đủ" class="form-control" id="name" th:field="*{name}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                
                <div class="form-group">
                    <input type="email" placeholder="Email" class="form-control" id="email" th:field="*{email}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                
                <div class="form-group">
                    <input type="password" class="form-control" placeholder="Mật khẩu" th:field="*{password}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Địa chỉ" th:field="*{address}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
                
                <div class="form-group">
                    <input type="text" class="form-control" placeholder="Số điện thoại" th:field="*{phoneNumber}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>
                
                <button type="submit" class="btn btn-primary">Đăng ký</button>
                
                <p class="login-link">
                  Bạn chưa có tài khoản? <a th:href="@{/login}">Đăng ký ngay</a>
              </p>
            </form>
        </div>
    </div>
</body>
</html>
