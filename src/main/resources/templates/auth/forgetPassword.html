<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Quên mật khẩu</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Forgot Password Form Template" name="keywords">
    <meta content="Forgot Password Form Template" name="description">

    <!-- Favicon -->
    <link th:href="@{img/favicon.ico}" rel="icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .forgot-container {
            display: flex;
            width: 900px;
            max-width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        
        .side-panel {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            width: 40%;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .side-panel img {
            max-width: 120px;
            margin-bottom: 30px;
        }
        
        .info-text {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .info-description {
            font-size: 16px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .forgot-card {
            background-color: #fff;
            width: 60%;
            padding: 50px 40px;
        }
        
        .forgot-title {
            color: #223354;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
        }
        
        .forgot-subtitle {
            color: #637381;
            font-size: 16px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E0E3E7;
            border-radius: 8px;
            font-size: 16px;
            color: #223354;
            outline: none;
            transition: border-color 0.2s ease;
        }
        
        .form-control:focus {
            border-color: #4F46E5;
        }
        
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
            background-color: #4F46E5;
            color: #fff;
            margin-bottom: 20px;
        }
        
        .btn:hover {
            background-color: #4338CA;
        }
        
        .links-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        
        .links-container a {
            color: #4F46E5;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .links-container a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .forgot-container {
                flex-direction: column;
                max-width: 90%;
            }
            
            .side-panel, .forgot-card {
                width: 100%;
            }
            
            .side-panel {
                padding: 40px 30px;
            }
            
            .forgot-card {
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="forgot-container">
        <div class="side-panel">
            <img th:src="@{img/logo.png}" alt="Logo">
            <h2 class="info-text">Khôi phục mật khẩu</h2>
            <p class="info-description">Khi nhấn gửi, mật khẩu mới sẽ được gửi về email của bạn!</p>
        </div>
        
        <style>
            .side-panel img {
                max-width: 200px; 
                max-height: 200px; 
                margin-bottom: 30px;
                object-fit: contain; 
            }
        </style>

        <div class="forgot-card">
            <h1 class="forgot-title">Quên mật khẩu</h1>
            <p class="forgot-subtitle">Vui lòng nhập email đã đăng ký của bạn</p>
            
            <form th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <input type="email" id="forgot-email" name="forgot-email" class="form-control" placeholder="your.email@example.com" required>
                </div>
                
                <button type="submit" class="btn">Gửi</button>
                
                <div class="links-container">
                    <a th:href="@{/register}">Tạo tài khoản</a>
                    <a th:href="@{/login}">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
