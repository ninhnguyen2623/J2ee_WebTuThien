<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <title>Thanh toán thất bại</title>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .error-container {
            max-width: 700px;
            width: 90%;
            margin: 20px auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #dc3545, #ff6b6b);
        }

        .error-icon {
            font-size: 80px;
            color: #dc3545;
            margin-bottom: 25px;
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .error-heading {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 30px;
            font-size: 2.5rem;
            animation: fadeInDown 0.5s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            color: #6c757d;
            font-size: 1.2rem;
            margin: 25px 0;
            line-height: 1.6;
            animation: fadeIn 0.5s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .order-details {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.5s ease-out 0.5s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .order-details h4 {
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .order-table {
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .order-table td {
            padding: 20px;
            vertical-align: middle;
            border-bottom: 1px solid #e9ecef;
        }

        .order-table td:first-child {
            color: #6c757d;
            font-weight: 500;
            width: 40%;
        }

        .order-table td:last-child {
            color: #2c3e50;
            font-weight: 600;
        }

        .btn-try-again {
            background: linear-gradient(45deg, #dc3545, #ff6b6b);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
            animation: fadeIn 0.5s ease-out 0.7s both;
        }

        .btn-try-again:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(220, 53, 69, 0.4);
            color: white;
            text-decoration: none;
        }

        .btn-try-again:active {
            transform: translateY(-1px);
        }

        .btn-try-again i {
            margin-right: 10px;
        }

        @media (max-width: 576px) {
            .error-container {
                padding: 20px;
            }

            .error-heading {
                font-size: 2rem;
            }

            .order-details {
                padding: 20px;
            }

            .btn-try-again {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="error-container text-center">
            <i class="fas fa-times-circle error-icon"></i>
            <h1 class="error-heading">Thanh toán thất bại</h1>

            <p class="error-message">
                Rất tiếc, giao dịch của bạn không thể hoàn tất.
                Vui lòng kiểm tra lại thông tin và thử lại sau.
            </p>

            <div class="order-details">
                <h4>Chi tiết đơn hàng</h4>
                <table class="table order-table">
                    <tbody>
                        <tr>
                            <td>Mã đơn hàng</td>
                            <td th:text="${orderId}">[order ID]</td>
                        </tr>
                        <tr>
                            <td>Tổng tiền</td>
                            <td th:text="${totalPrice}">[total price]</td>
                        </tr>
                        <tr>
                            <td>Thời gian</td>
                            <td th:text="${paymentTime}">[payment time]</td>
                        </tr>
                        <tr>
                            <td>Mã giao dịch</td>
                            <td th:text="${transactionId}">[transaction ID]</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="mt-4">
                <a href="/" class="btn btn-try-again">
                    <i class="fas fa-redo"></i>Thử lại
                </a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
