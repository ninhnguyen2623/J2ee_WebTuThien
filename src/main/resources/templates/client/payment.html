<!DOCTYPE html>
<html lang="en" layout:decorate="~{fragments/_layout}" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Payment</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .payment-method-badge {
            background: #000;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .amount-badge {
            padding: 10px 20px;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .amount-badge:hover {
            background: #ccc;
            color: white;
        }
        
        .amount-badge.active {
            background: #ccc;
            color: white;
        }
        .form-control {
            outline: none !important;
        }
        .form-control:focus {
            border-color: #cccc !important;
        }
        
        .invalid-feedback {
            display: none;
            color: #dc3545;
            font-size: 0.875em;
        }

        .was-validated .form-control:invalid ~ .invalid-feedback {
            display: block;
        }
        .btn-payment-vnpay {
            background-color: #3c3c3c !important;
        }
    </style>
</head>
<body>
    <main layout:fragment="content">
        <div class="container-fluid page-header mb-5 wow fadeIn" data-wow-delay="0.1s">
            <div class="container text-center">
                <h1 class="display-4 text-white animated slideInDown mb-4">Payment</h1>
                <nav aria-label="breadcrumb animated slideInDown">
                    <ol class="breadcrumb justify-content-center mb-0">
                        <li class="breadcrumb-item"><a class="text-white" href="/">Home</a></li>
                        <li class="breadcrumb-item text-primary active">Payment</li>
                    </ol>
                </nav>
            </div>
        </div>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow-sm">
                        <div class="card-body p-5">
                            <div class="payment-method-badge bg-success mb-4">
                                <i class="fas fa-credit-card me-2"></i>Thanh Toán VNPay
                            </div>

                            <form th:action="@{/payment/submitOrder}" method="post" class="needs-validation" novalidate>
                                <input type="hidden" name="programId" th:value="${programId}" />
                                
                                <div class="mb-4">
                                    <label class="form-label">Chọn mệnh giá</label>
                                    <div class="d-flex flex-wrap gap-2">
                                        <div class="amount-badge" data-amount="50000">50,000đ</div>
                                        <div class="amount-badge" data-amount="100000">100,000đ</div>
                                        <div class="amount-badge" data-amount="200000">200,000đ</div>
                                        <div class="amount-badge" data-amount="500000">500,000đ</div>
                                        <div class="amount-badge" data-amount="1000000">1,000,000đ</div>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="amount" class="form-label">Số tiền (VND)</label>
                                    <input type="number" 
                                           class="form-control fs-5 form-control-lg" 
                                           id="amount" 
                                           name="amount" 
                                           required 
                                           min="10000"
                                           placeholder="Nhập số tiền">
                                    <div class="invalid-feedback">
                                        Mệnh giá ít nhất là 10.000VND
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="orderInfo" class="form-label">Nội dung</label>
                                    <textarea class="form-control" 
                                              id="orderInfo" 
                                              name="orderInfo" 
                                              rows="3"
                                              placeholder="NGUYEN VAN A chuyen tien..."></textarea>
                                </div>

                               <div class="d-flex justify-content-end">
                                <button type="submit" class="btn btn-dark btn-payment-vnpay btn-lg fs-5">
                                    <i class="fa-solid fa-money-bill-trend-up px-2"></i>
                                    Đi đến thanh toán
                                </button>
                               </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
